# Development databases.
#   PostgreSQL (default):       docker compose -f docker-compose.dev.yml up -d
#   Also SQL Server Express:    docker compose -f docker-compose.dev.yml --profile sqlserver up -d

name: nexagen-pos

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tausi
      POSTGRES_PASSWORD: tausi_dev
      POSTGRES_DB: tausipos
    ports:
      - "5432:5432"
    volumes:
      - tausi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tausi"]
      interval: 5s
      retries: 10

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["sqlserver"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: "Tausi_dev_123"
    ports:
      - "1433:1433"
    volumes:
      - tausi-mssqldata:/var/opt/mssql

# Renamed with the product (Tausi POS); the old pgdata / mssqldata volumes are left untouched.
volumes:
  tausi-pgdata:
  tausi-mssqldata:
