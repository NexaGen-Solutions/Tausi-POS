# Development databases.
#   PostgreSQL (default):       docker compose -f docker-compose.dev.yml up -d
#   Also SQL Server Express:    docker compose -f docker-compose.dev.yml --profile sqlserver up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nexagen
      POSTGRES_PASSWORD: nexagen_dev
      POSTGRES_DB: nexagen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexagen"]
      interval: 5s
      retries: 10

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["sqlserver"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: "Nexagen_dev_123"
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql

volumes:
  pgdata:
  mssqldata:
