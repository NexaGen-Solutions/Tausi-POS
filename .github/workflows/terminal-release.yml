name: Tausi POS terminal release

on:
  push:
    tags:
      - "terminal-v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: terminal/src-tauri
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Install Tauri CLI
        run: npm ci
        working-directory: terminal
      - name: Build installer
        run: npm run tauri build
        working-directory: terminal
      - name: Name the installer TausiPOS-Setup.exe
        shell: pwsh
        run: Copy-Item (Get-ChildItem terminal/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1) TausiPOS-Setup.exe
      - uses: actions/upload-artifact@v7
        with:
          name: tausi-terminal-windows
          path: TausiPOS-Setup.exe
      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: TausiPOS-Setup.exe
