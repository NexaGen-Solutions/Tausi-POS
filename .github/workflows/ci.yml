name: Tausi POS CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tausi
          POSTGRES_PASSWORD: tausi_ci
          POSTGRES_DB: tausipos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tausi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # Integration tests use this server instead of starting their own container.
      TAUSI_TEST_POSTGRES: "Host=localhost;Port=5432;Username=tausi;Password=tausi_ci;Database=tausipos"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.402"  # pinned: 10.0.403's download link is broken (2026-10-25)
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: No customer names in the product (and the check's own self-test)
        working-directory: .
        run: |
          node --test scripts/check-customer-names.test.mjs
          node scripts/check-customer-names.mjs
      - name: Brand icons (every size, and the references to them)
        working-directory: .
        run: node --test tools/brand/icons.test.mjs

  notices:
    # THIRD-PARTY-NOTICES and THIRD-PARTY-LICENSES.txt list every shipped component with its licence text.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.402"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tools/notices/package-lock.json
      - name: Install what the lists are read from
        run: |
          (cd web && npm ci)
          (cd tools/notices && npm ci)
      - name: Every shipped component is listed, with its licence text
        run: node tools/notices/build-notices.mjs --check

  load:
    # A short busy Friday (3 simulated hours at 18x, about 10 minutes): fails on a missed target or any
    # difference after the run. The full 6-hour run on both databases is load-test.yml (nightly).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tausi
          POSTGRES_PASSWORD: tausi_ci
          POSTGRES_DB: tausi_load
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tausi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_NOLOGO: "1"
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Tausi: "Host=localhost;Port=5432;Username=tausi;Password=tausi_ci;Database=tausi_load"
      Urls: http://localhost:5080
      TAUSI_ADMIN_PASSWORD: ci-load-1
      Tausi__Printing__OutputDirectory: ${{ github.workspace }}/print-output
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.402"
      - name: Build the server and the load test
        run: |
          dotnet build server/src/Tausi.Api -c Release
          dotnet build tools/Tausi.LoadTest -c Release
      - name: The demo business, then the server
        run: |
          (cd server && dotnet run --no-build -c Release --project src/Tausi.Api -- seed --demo > "$RUNNER_TEMP/seed.txt")
          (cd server && dotnet run --no-build -c Release --project src/Tausi.Api > "$RUNNER_TEMP/server.log" 2>&1 &)
          for i in $(seq 1 90); do curl -s localhost:5080/api/health | grep -q '"database":"ok"' && break; sleep 1; done
      - name: Load test
        run: |
          set -o pipefail
          dotnet run --no-build -c Release --project tools/Tausi.LoadTest -- --server http://localhost:5080 \
            --admin-password "$TAUSI_ADMIN_PASSWORD" --seed-output "$RUNNER_TEMP/seed.txt" --provider Postgres \
            --db "$ConnectionStrings__Tausi" --print-output "$Tausi__Printing__OutputDirectory" \
            --hours 3 --speed 18 --out load-result.json | tee load-result.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: load-test
          path: |
            load-result.*
            ${{ runner.temp }}/server.log
          if-no-files-found: warn

  screenshots:
    # The main screens in the brand colours, for a person to look at (not compared pixel by pixel).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tausi
          POSTGRES_PASSWORD: tausi_ci
          POSTGRES_DB: tausi_shots
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tausi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Tausi: "Host=localhost;Port=5432;Username=tausi;Password=tausi_ci;Database=tausi_shots"
      Urls: http://0.0.0.0:5080
      TAUSI_ADMIN_PASSWORD: ci-screens-1
      OUT: ${{ github.workspace }}/screenshots
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.402"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tools/screenshots/package-lock.json
      - name: Use the runner's network address, not localhost
        # As at a business: plain http://<server>:5080 is not a secure page, so browser features
        # that need HTTPS or localhost (crypto.randomUUID, the clipboard) are missing here too.
        run: echo "WEB_URL=http://$(hostname -I | awk '{print $1}'):5080" >> "$GITHUB_ENV"
      - name: Build the web app (the server serves web/dist in Development)
        working-directory: web
        run: npm ci && npm run build
      - name: Build the server
        working-directory: server
        run: dotnet build src/Tausi.Api -c Debug
      - name: Install Playwright
        working-directory: tools/screenshots
        run: npm ci && npx playwright install --with-deps chromium
      - name: A server that isn't set up yet - wizard, pairing, splash
        run: |
          (cd server && dotnet run --no-build --project src/Tausi.Api > "$RUNNER_TEMP/server-1.log" 2>&1 &)
          for i in $(seq 1 90); do curl -s $WEB_URL/api/health | grep -q '"database":"ok"' && test -f server/src/Tausi.Api/data/setup-token.txt && break; sleep 1; done
          cd tools/screenshots && SETUP_TOKEN_FILE=../../server/src/Tausi.Api/data/setup-token.txt node capture.mjs fresh
      - name: The demo business - PIN, tables, order, settle, admin, About
        run: |
          pkill -f TausiServer || true
          sleep 2
          (cd server && dotnet run --no-build --project src/Tausi.Api -- seed --demo > "$RUNNER_TEMP/seed.txt")
          (cd server && dotnet run --no-build --project src/Tausi.Api > "$RUNNER_TEMP/server-2.log" 2>&1 &)
          for i in $(seq 1 90); do curl -s $WEB_URL/api/health | grep -q '"database":"ok"' && break; sleep 1; done
          cd tools/screenshots && SEED_OUTPUT="$RUNNER_TEMP/seed.txt" node capture.mjs demo
      - name: The user guides' pictures and their PDFs (docs/guides)
        run: |
          cd tools/screenshots
          SEED_OUTPUT="$RUNNER_TEMP/seed.txt" OUT=../../docs/guides/images node capture.mjs guides
          node guides-pdf.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: |
            screenshots/
            docs/guides/images/
            docs/guides/pdf/
            ${{ runner.temp }}/server-*.log
          if-no-files-found: warn

  terminal-windows:
    # The Windows terminal app (Tauri) with real printing through the Windows spooler.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            terminal/print -> target
            terminal/src-tauri -> target
      - name: Build the web app (bundled for the setup screen)
        run: npm ci && npm run build
        working-directory: web
      - name: Test the print crate
        run: cargo test
        working-directory: terminal/print
      - name: Test the terminal app
        run: cargo test
        working-directory: terminal/src-tauri
      - name: Build the installer
        run: npm ci && npm run tauri build
        working-directory: terminal
      - name: Name the installer TausiPOS-Setup.exe
        shell: pwsh
        run: Copy-Item (Get-ChildItem terminal/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1) TausiPOS-Setup.exe
      # Lets the owner install a branch build on a real counter PC without a release tag.
      - uses: actions/upload-artifact@v7
        with:
          name: tausi-terminal-windows
          path: TausiPOS-Setup.exe
          if-no-files-found: error
          retention-days: 14

  audit:
    # Known vulnerabilities in what ships: fails on high or critical ones.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.402"  # pinned: 10.0.403's download link is broken (2026-10-25)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: .NET packages
        working-directory: server
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -qE '\b(High|Critical)\b' vulnerable.txt; then echo "High or critical vulnerabilities above."; exit 1; fi
      - name: npm (web app)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Rust crates (terminal app)
        working-directory: terminal/src-tauri
        run: cargo audit

  linux-package:
    # The Linux tarball on a real Ubuntu 24.04 with systemd: install --with-postgres, then upgrade.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.402"  # pinned: 10.0.403's download link is broken (2026-10-25)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web app
        run: npm ci && npm run build
        working-directory: web
      - name: Publish the server (linux-x64, self-contained)
        run: dotnet publish server/src/Tausi.Api -c Release -r linux-x64 --self-contained true -p:Version=0.15.0 -o out/server-linux
      - name: Make the tarball
        run: packaging/linux/make-tarball.sh 0.15.0 out/server-linux out
      - name: Install it
        run: |
          mkdir -p out/try && tar -C out/try -xzf out/tausi-server-0.15.0-linux-x64.tar.gz
          cd out/try/tausi-server-0.15.0-linux-x64 && sudo ./install.sh --with-postgres | tee ../../install.txt
          grep -E 'http://[0-9.]+:5080' ../../install.txt
          grep -A1 'setup token' ../../install.txt | tail -1 | grep -E '[A-Z0-9]{4}-[A-Z0-9]{4}'
          systemctl is-active tausi
          curl -fsS http://127.0.0.1:5080/health | tee ../../health.json && grep -q '"database":"ok"' ../../health.json
      - name: Upgrade it (backs up first)
        run: |
          cd out/try/tausi-server-0.15.0-linux-x64 && sudo ./install.sh
          sudo ls /var/lib/tausi/backups | grep -- '-upgrade.tausibak'
          systemctl is-active tausi
      - name: Logs
        if: failure()
        run: sudo journalctl -u tausi --no-pager | tail -100; sudo ls -la /var/log/tausi; sudo sh -c 'tail -50 /var/log/tausi/*.log'

  installer-windows:
    # The server installer on Windows: silent install on SQL Server Express, upgrade, a failed upgrade's
    # rollback, uninstall; and the terminal installer's silent install.
    runs-on: windows-latest
    needs: terminal-windows
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.402"  # pinned: 10.0.403's download link is broken (2026-10-25)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: SQL Server Express (the "existing SQL Server", as at many bars)
        shell: pwsh
        run: choco install sql-server-express -y --no-progress
      - name: WiX Toolset v5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2 WixToolset.Firewall.wixext/5.0.2
      - name: Build the web app
        run: npm ci && npm run build
        working-directory: web
      - name: Publish the server (win-x64, self-contained) three times
        shell: pwsh
        run: |
          foreach ($v in '0.15.1', '0.15.2') {
            dotnet publish server/src/Tausi.Api -c Release -r win-x64 --self-contained true -p:Version=$v -o out/server-$v
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Build the installers (a first version, an upgrade, and a broken upgrade)
        shell: pwsh
        run: |
          installer/windows/build.ps1 -Version 0.15.1 -Server out/server-0.15.1 -Out out/a
          installer/windows/build.ps1 -Version 0.15.2 -Server out/server-0.15.2 -Out out/b
          installer/windows/build.ps1 -Version 0.15.3 -Server out/server-0.15.2 -Out out/c -FailMigration
      - uses: actions/download-artifact@v7
        with:
          name: tausi-terminal-windows
          path: out/terminal
      - name: Test the installers
        shell: pwsh
        timeout-minutes: 50
        run: installer/windows/test-install.ps1 -First out/a/TausiPOS-Server-Setup-0.15.1.exe -Upgrade out/b/TausiPOS-Server-Setup-0.15.2.exe -Broken out/c/TausiPOS-Server-Setup-0.15.3.exe -Terminal out/terminal/TausiPOS-Setup.exe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: install-logs
          path: out/install-logs
          if-no-files-found: ignore
      # Uploaded even when the tests fail, so it can be tried on a real PC.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tausi-server-windows
          path: out/a/TausiPOS-Server-Setup-0.15.1.exe
          if-no-files-found: ignore
          retention-days: 14
