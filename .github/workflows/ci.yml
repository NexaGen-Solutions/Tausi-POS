name: Tausi POS CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tausi
          POSTGRES_PASSWORD: tausi_ci
          POSTGRES_DB: tausipos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tausi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # Integration tests use this server instead of starting their own container.
      TAUSI_TEST_POSTGRES: "Host=localhost;Port=5432;Username=tausi;Password=tausi_ci;Database=tausipos"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  terminal-windows:
    # The Windows terminal app (Tauri) with real printing through the Windows spooler.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            terminal/print -> target
            terminal/src-tauri -> target
      - name: Build the web app (bundled for the setup screen)
        run: npm ci && npm run build
        working-directory: web
      - name: Test the print crate
        run: cargo test
        working-directory: terminal/print
      - name: Build and test the terminal app
        run: cargo test && cargo build
        working-directory: terminal/src-tauri
