[package]
name = "nexagen-terminal"
version = "0.1.0"
description = "Nexagen Terminal: the full-screen POS app for counter PCs"
edition = "2021"

[lib]
name = "nexagen_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
