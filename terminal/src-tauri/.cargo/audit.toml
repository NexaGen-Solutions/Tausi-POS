# cargo audit settings for the terminal app (CI runs `cargo audit` here).
[advisories]
# zip 4.x, pulled in by tauri-plugin-updater 2.14.0 (the newest stable; it requires zip ^4) for Windows
# updates packed as .zip. Tausi POS's terminal updates are NSIS .exe installers, not .zip, so the
# extraction these advisories are about never runs; and every update's signature is checked before
# anything is unpacked. Remove these when the updater moves to zip >= 9.
ignore = [
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]
